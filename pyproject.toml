[project]
name = "insightpilot"
version = "0.1.0"
description = "InsightPilot — Agentic AI-powered Business Intelligence Assistant (Phase 1 project foundation)"
authors = [
    { name = "mhdnasim6-boop", email = "mhdnasim6@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.10",
    "loguru>=0.7.3",
    "numpy>=2.5.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pymysql>=1.2.0",
    "sqlalchemy>=2.0.51",
    "streamlit>=1.60.0",
    "uvicorn[standard]>=0.52.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend", "frontend", "shared", "config"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true

# plotly ships with no py.typed marker/stubs at all — every attribute access
# would otherwise need its own ignore comment. Scoped to plotly.* only (not
# a project-wide relaxation); the visualization exporters are the one place
# this module is imported.
[[tool.mypy.overrides]]
module = "plotly.*"
ignore_missing_imports = true

[tool.ruff.lint]
# B008: flags `Depends(...)` used as a function-argument default. That is
# the required, idiomatic way to do dependency injection in FastAPI
# (backend/api/v1/health.py, backend/dependencies/services.py) — rewriting
# it to satisfy this rule would break the DI pattern, not improve it.
#
# UP046 / UP047: flag traditional `Generic[T]` classes / `TypeVar`-based
# generic functions in favor of PEP 695's `class Foo[T]` / `def foo[T]`
# syntax. This project intentionally keeps the traditional TypeVar/Generic
# form (backend/repositories/base.py, backend/schemas/response.py) for
# broader tooling and Pydantic generic-model compatibility.
ignore = ["B008", "UP046", "UP047"]
