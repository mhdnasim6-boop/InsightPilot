# InsightPilot enterprise theme.
#
# Both a light and a dark theme are defined explicitly (rather than
# relying on Streamlit's own built-in defaults) so the app has one
# deliberate, cohesive palette in both modes — selectable from
# Streamlit's own native "Settings -> Choose app theme" menu, no custom
# JS/CSS toggle needed. Colors are drawn from this project's validated
# data-visualization reference palette (see the `dataviz` skill's own
# `references/palette.md`) so the same hues used for chart series/status
# also drive the surrounding UI chrome — one system, not two.
#
# `*BackgroundColor`/`*TextColor` sub-variants (e.g. `greenBackgroundColor`)
# are deliberately left unset in both modes: Streamlit derives readable
# tinted-background/text pairs from each base color automatically, and
# guessing those pairs by hand without a contrast validator risks a worse
# result than Streamlit's own derivation.
#
# `base`/`chartCategoricalColors` are top-level-only options (invalid
# inside `[theme.light]`/`[theme.dark]` — confirmed against the installed
# streamlit.config option registry); `chartCategoricalColors` only
# affects Streamlit's own native charting (`st.bar_chart`/`st.line_chart`
# etc.), which this app doesn't use anywhere — every chart is a
# server-rendered Plotly figure already carrying the backend's own
# ThemeRegistry colors (see `frontend/components/chart_container.py`) —
# so one static array here is a harmless, future-proofing default, not a
# functional requirement today.

[theme]
base = "light"
font = "sans-serif"
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#fcfcfb"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
dataframeBorderColor = "#e1e0d9"
linkColor = "#2a78d6"
codeBackgroundColor = "#fcfcfb"
redColor = "#d03b3b"
orangeColor = "#ec835a"
yellowColor = "#fab219"
greenColor = "#0ca30c"
blueColor = "#2a78d6"
violetColor = "#4a3aa7"
grayColor = "#898781"

[theme.light.sidebar]
backgroundColor = "#fcfcfb"
borderColor = "#e1e0d9"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#ffffff"
borderColor = "#2c2c2a"
dataframeBorderColor = "#2c2c2a"
linkColor = "#3987e5"
codeBackgroundColor = "#1a1a19"
redColor = "#e66767"
orangeColor = "#d95926"
yellowColor = "#c98500"
greenColor = "#0ca30c"
blueColor = "#3987e5"
violetColor = "#9085e9"
grayColor = "#898781"

[theme.dark.sidebar]
backgroundColor = "#1a1a19"
borderColor = "#2c2c2a"
