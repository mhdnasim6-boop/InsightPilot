# ClusterIP Services fronting each Deployment. Put an Ingress/LoadBalancer
# in front of insightpilot-frontend (and insightpilot-backend, if it needs
# to be reachable directly) yourself — none is included here.
apiVersion: v1
kind: Service
metadata:
  name: insightpilot-backend
  labels:
    app: insightpilot
    component: backend
spec:
  type: ClusterIP
  selector:
    app: insightpilot
    component: backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: insightpilot-frontend
  labels:
    app: insightpilot
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: insightpilot
    component: frontend
  ports:
    - port: 8501
      targetPort: 8501
